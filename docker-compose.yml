# WHAT:  The Slice 1 stack on one machine: Postgres+pgvector, Redis, a one-shot migration job,
#        the API and a scalable ARQ worker, plus an on-demand `tools` container (Spec 008).
# WHERE: Local deployment step 1. The same image and environment contract are reused by the
#        kind/KEDA manifests (Spec 010) and the Terraform plan (Spec 011).
# WHY:   Compose is the cheapest way to prove the image, startup order, health model and
#        least-privilege secret wiring before adding Kubernetes. Key choices, in brief:
#          * No `env_file`: every service lists exactly the variables it needs, so the
#            superuser ADMIN_DATABASE_URL reaches only `migrate`/`tools`, and provider keys only
#            `worker`/`tools`. A compromised API container holds neither.
#          * Required passwords use `:?` so a missing value stops `up` instead of starting
#            with an empty password. No secret value appears in this file.
#          * Redis uses `noeviction`: queue, job state and rate-limit counters must never be
#            silently evicted; `appendonly` + volume keep them across restarts.
#          * Host ports are 127.0.0.1-only and default to 5433/6380 so they do not collide with
#            other local Postgres/Redis containers. Services talk to each other by name on the
#            standard ports inside the compose network.
#          * `worker` has no container_name/ports, so `--scale worker=N` works (the local
#            rehearsal of KEDA autoscaling).
#          * Observability (Spec 009): api/worker log JSON and serve Prometheus metrics on
#            internal-only ports (`expose`, never published). The `observability` profile adds
#            Prometheus + Grafana on 127.0.0.1. LOG_HASH_KEY is required so the API and every
#            worker hash tenant ids identically in logs.
#        Passwords go into connection URLs, so use URL-safe characters (no @ : / ? #).

name: deal-intelligence

x-app-build: &app-build
  context: .
  dockerfile: infra/docker/Dockerfile
  target: runtime

# Hardening shared by every process we build (api, worker, migrate).
x-hardened: &hardened
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: deal_intel
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deal_intel"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrate:
    # The one service that builds the shared image; api and worker only reference it (two
    # services building the same tag in parallel race). They start after migrate, so it exists.
    <<: *hardened
    build: *app-build
    image: deal-intelligence:local
    command: ["python", "-m", "agents.migrate"]
    environment:
      # Superuser URL: DDL only, and only in this one-shot container.
      ADMIN_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/deal_intel
      DATABASE_URL: postgresql://app_user:${APP_USER_PASSWORD:?set APP_USER_PASSWORD in .env}@postgres:5432/deal_intel
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *hardened
    image: deal-intelligence:local
    pull_policy: never
    # --no-access-log: the app's own middleware writes one structured access line per request.
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    expose:
      - "9101"
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql://app_user:${APP_USER_PASSWORD}@postgres:5432/deal_intel
      REDIS_URL: redis://redis:6379/0
      LOG_FORMAT: json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_HASH_KEY: ${LOG_HASH_KEY:?set LOG_HASH_KEY in .env}
      METRICS_BIND_HOST: 0.0.0.0
      API_METRICS_PORT: 9101
      RATE_LIMIT_JOBS_PER_MINUTE: ${RATE_LIMIT_JOBS_PER_MINUTE:-30}
      TENANT_MAX_ACTIVE_JOBS: ${TENANT_MAX_ACTIVE_JOBS:-10}
      TENANT_DAILY_MAX_LLM_CALLS: ${TENANT_DAILY_MAX_LLM_CALLS:-500}
      TENANT_DAILY_MAX_SEARCHES: ${TENANT_DAILY_MAX_SEARCHES:-500}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      # Liveness only (/healthz): it must not depend on backends. Readiness is /readyz.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: ${API_MEM_LIMIT:-512m}
          cpus: "${API_CPU_LIMIT:-1.0}"
    restart: unless-stopped

  worker:
    <<: *hardened
    image: deal-intelligence:local
    pull_policy: never
    command: ["arq", "workers.settings.WorkerSettings"]
    expose:
      - "9100"
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql://app_user:${APP_USER_PASSWORD}@postgres:5432/deal_intel
      REDIS_URL: redis://redis:6379/0
      LOG_FORMAT: json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_HASH_KEY: ${LOG_HASH_KEY:?set LOG_HASH_KEY in .env}
      METRICS_BIND_HOST: 0.0.0.0
      WORKER_METRICS_PORT: 9100
      PRICE_PER_LLM_CALL: ${PRICE_PER_LLM_CALL:-0.01}
      PRICE_PER_SEARCH: ${PRICE_PER_SEARCH:-0.008}
      # Provider settings: empty values leave lead research unconfigured (echo jobs still work).
      LLM_MODEL: ${LLM_MODEL:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-deal-intelligence}
      TENANT_DAILY_MAX_LLM_CALLS: ${TENANT_DAILY_MAX_LLM_CALLS:-500}
      TENANT_DAILY_MAX_SEARCHES: ${TENANT_DAILY_MAX_SEARCHES:-500}
      JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-300}
      # 0 = the free echo job ignores `delay_seconds`; the smoke test enables it to watch scaling.
      ECHO_MAX_DELAY_SECONDS: ${ECHO_MAX_DELAY_SECONDS:-0}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "arq", "--check", "workers.settings.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Spec 010: the worker drains on SIGTERM (WorkerSettings.job_completion_wait = JOB_TIMEOUT_SECONDS):
    # it stops picking jobs and lets running ones finish. The grace period must exceed that wait
    # (default 300s + 30s), otherwise Docker would SIGKILL a job mid-drain. Anything still running
    # after the wait is cancelled and recorded failed by run_job (Spec 008).
    stop_grace_period: ${WORKER_STOP_GRACE:-330s}
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEM_LIMIT:-1g}
          cpus: "${WORKER_CPU_LIMIT:-1.0}"
    restart: unless-stopped

  # On-demand operator/eval container: `docker compose run --rm tools python -m agents.admin ...`
  tools:
    <<: *hardened
    profiles: ["tools"]
    build:
      <<: *app-build
      target: tools
    image: deal-intelligence-tools:local
    command: ["python", "-m", "agents.admin"]
    environment:
      ADMIN_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/deal_intel
      DATABASE_URL: postgresql://app_user:${APP_USER_PASSWORD}@postgres:5432/deal_intel
      REDIS_URL: redis://redis:6379/0
      LLM_MODEL: ${LLM_MODEL:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-deal-intelligence}
      EVAL_REPORT_DIR: /tmp/eval-reports  # root filesystem is read-only
    depends_on:
      migrate:
        condition: service_completed_successfully

  # ---- Observability profile (Spec 009): `docker compose --profile observability up -d` ----
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=3d
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.3.1
    # `:?` cannot be used here: compose interpolates inactive profiles too, so it would break
    # `up` for everyone who does not use observability. The entrypoint refuses to start instead.
    entrypoint:
      - /bin/sh
      - -c
      - '[ -n "$$GF_SECURITY_ADMIN_PASSWORD" ] || { echo "set GRAFANA_ADMIN_PASSWORD in .env" >&2; exit 1; }; exec /run.sh'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  promdata:
  grafanadata:
