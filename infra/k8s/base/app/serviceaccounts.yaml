# WHAT:  One ServiceAccount per workload, none of which can talk to the Kubernetes API.
# WHERE:  Referenced by api.yaml, worker.yaml, ../migrate/job.yaml.
# WHY:    The app never calls the Kubernetes API, so no token is mounted (a compromised pod then
#         has no cluster credentials to steal). Separate accounts keep RBAC grants per workload
#         possible later (e.g. IRSA on EKS, Spec 011) without touching the others.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: deal-intel
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  namespace: deal-intel
automountServiceAccountToken: false
