# WHAT:  The FastAPI Deployment (2 replicas), its Services and a PodDisruptionBudget.
# WHERE:  Part of infra/k8s/base/app; reached with `kubectl port-forward svc/api 8000`.
# WHY:    Probes mirror the health model from Spec 008: liveness is `/healthz` (never depends on
#         backends, so a Redis blip cannot restart every pod), readiness is `/readyz` (Postgres
#         + Redis), and a startupProbe protects slow starts. Two replicas plus a PDB keep one pod
#         up through node drains. Hardening equals Compose, in Kubernetes terms (non-root numeric
#         user, read-only root, no capabilities, RuntimeDefault seccomp). The metrics port is a
#         separate Service so network policy can expose it to KEDA without exposing the API.
#         Image `deal-intelligence:local` is replaced per overlay.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: deal-intel
  labels: {app.kubernetes.io/name: api, app.kubernetes.io/part-of: deal-intelligence}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: api, app.kubernetes.io/part-of: deal-intelligence}
    spec:
      serviceAccountName: api
      automountServiceAccountToken: false
      # Service links inject vars like WORKER_METRICS_PORT=tcp://ip:9100 that COLLIDE with our own
      # settings names (found in the first deploy: pydantic could not parse them). Off, always.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: deal-intelligence:local
          command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
          ports:
            - {name: http, containerPort: 8000}
            - {name: metrics, containerPort: 9101}
          envFrom:
            - configMapRef: {name: app-config}
            - secretRef: {name: app-secrets}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: deal-intel
spec:
  selector: {app.kubernetes.io/name: api}
  ports:
    - {name: http, port: 8000, targetPort: http}
---
apiVersion: v1
kind: Service
metadata:
  name: api-metrics
  namespace: deal-intel
spec:
  selector: {app.kubernetes.io/name: api}
  ports:
    - {name: metrics, port: 9101, targetPort: metrics}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: deal-intel
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: api}
