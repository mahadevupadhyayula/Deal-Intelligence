# WHAT:  In-cluster PostgreSQL + pgvector (StatefulSet, PVC, Service) for the local rehearsal.
# WHERE:  Local overlay only. On AWS (Spec 011) this is replaced by RDS and not deployed at all.
# WHY:    Same image as Compose. Runs as uid 999 (the image's `postgres` user) so it passes the
#         namespace's PSA `restricted` policy; `fsGroup` lets the PVC be writable. The superuser
#         password comes from `postgres-secrets` (created by the deploy script from .env).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: deal-intel
  labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: deal-intelligence}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: deal-intelligence}
    spec:
      automountServiceAccountToken: false
      # Service links inject vars like WORKER_METRICS_PORT=tcp://ip:9100 that COLLIDE with our own
      # settings names (found in the first deploy: pydantic could not parse them). Off, always.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - {name: pg, containerPort: 5432}
          env:
            - {name: POSTGRES_DB, value: deal_intel}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-secrets, key: POSTGRES_PASSWORD}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "deal_intel"]
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "deal_intel"]
            periodSeconds: 20
            failureThreshold: 6
            initialDelaySeconds: 30
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: deal-intel
spec:
  selector: {app.kubernetes.io/name: postgres}
  ports:
    - {name: pg, port: 5432, targetPort: pg}
