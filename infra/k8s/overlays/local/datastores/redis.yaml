# WHAT:  In-cluster Redis (StatefulSet, PVC, Service) for the ARQ queue, rate limits and job state.
# WHERE:  Local overlay only. On AWS (Spec 011) this is replaced by ElastiCache.
# WHY:    `noeviction` + append-only persistence exactly as in Compose: the queue and rate-limit
#         counters must never be silently evicted, and should survive a restart. Runs as uid 999
#         (the image's `redis` user) to satisfy PSA `restricted`.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: deal-intel
  labels: {app.kubernetes.io/name: redis, app.kubernetes.io/part-of: deal-intelligence}
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: redis}
  template:
    metadata:
      labels: {app.kubernetes.io/name: redis, app.kubernetes.io/part-of: deal-intelligence}
    spec:
      automountServiceAccountToken: false
      # Service links inject vars like WORKER_METRICS_PORT=tcp://ip:9100 that COLLIDE with our own
      # settings names (found in the first deploy: pydantic could not parse them). Off, always.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction", "--dir", "/data"]
          ports:
            - {name: redis, containerPort: 6379}
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 20
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: deal-intel
spec:
  selector: {app.kubernetes.io/name: redis}
  ports:
    - {name: redis, port: 6379, targetPort: redis}
