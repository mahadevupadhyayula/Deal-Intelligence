# Local overlay for the migration Job: use the image loaded into kind.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/migrate
patches:
  - target: {kind: Job, name: migrate}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
