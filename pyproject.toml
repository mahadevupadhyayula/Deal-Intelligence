[project]
name = "deal-intelligence"
version = "0.1.0"
description = "Multi-tenant B2B Deal Intelligence multi-agent SaaS"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agents*", "api*", "workers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # works even if the editable-install .pth is skipped (macOS hidden flag)

[tool.ruff]
line-length = 100
