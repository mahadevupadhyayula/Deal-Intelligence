[project]
name = "deal-intelligence"
version = "0.1.0"
description = "Multi-tenant B2B Deal Intelligence multi-agent SaaS"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2.5",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "arq>=0.26",
    "psycopg-pool>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agents*", "api*", "workers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]  # works even if the editable-install .pth is skipped (macOS hidden flag)

[tool.ruff]
line-length = 100
